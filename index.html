<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1> Rock Paper Scissors Game </h1>
    </header>
    <main class="main">
        <div class="container">
            <div class="score-board">
                You: <span>0</span>   |   Draw: <span>0</span>    | Computer: <span>0</span> 
            </div>
            <div class="game-board">
                <div class="game-buttons" data-move="rock">
                    <img src="./images/rock.webp" alt="rock">
                </div>
                <div class="game-buttons" data-move="paper">
                    <img src="./images/paper.webp" alt="paper">
                </div>
                <div class="game-buttons" data-move="scissor">
                    <img src="./images/scissor.webp" alt="scissor">
                </div>
            </div>
            <div class="btn-container">
                <button class="js-reset-btn">Reset score</button> 
                <button class="js-auto-play-btn">auto-play</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
