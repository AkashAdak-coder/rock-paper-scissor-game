<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>Rock Paper Scissor</header>
    <main>
        <section class="game-board">
            <div class="display-moves"></div>
            <div class="user-moves">

                <button title="rock button" onclick="game('rock')">
                <img src="./images/hand.png" alt="rock">
                </button>

                <button title="paper button" onclick="game('paper')">
                <img src="./images/hand-paper.png" alt="paper">
                </button>

                <button title="scissor button" onclick="game('scissor')">
                <img src="./images/scissors (1).png" alt="Scissor">
                </button>

            </div>
            <div class="feature-buttons">

                <button>auto-play</button>
                <button onclick="resetScore()">reset score</button>
                
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
